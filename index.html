<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutorial: Viabilidade de Reformas | GeoAPUC</title>
<style>
  :root{
    --azul-vibrante:#4285F4;
    --marinho:#1A2942;
    --laranja:#F5A623;
    --cinza-claro:#F4F6F9;
    --branco:#FFFFFF;
    --texto:#2D3748;
    --texto-claro:#6B7A90;
    --borda:#E2E8F0;
    --sidebar-w:280px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--texto);
    background:var(--cinza-claro);
    line-height:1.65;
  }

  .cover{
    position:relative;
    min-height:100vh;
    background:var(--branco);
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
  }

  .cover::after{
    content:"";
    position:absolute;
    top:-10%;
    right:-15%;
    width:65%;
    height:140%;
    background:var(--azul-vibrante);
    transform:rotate(18deg);
    z-index:0;
  }

  .cover-content{
    position:relative;
    z-index:1;
    max-width:900px;
    padding:0 6%;
  }

  .badge{
    display:inline-block;
    background:var(--laranja);
    color:var(--branco);
    font-weight:700;
    font-size:.8rem;
    letter-spacing:.08em;
    padding:.6rem 1.4rem;
    border-radius:6px;
    margin-bottom:2rem;
    text-transform:uppercase;
  }

  .cover h1{
    font-size:clamp(2.5rem, 6vw, 4.2rem);
    font-weight:800;
    color:var(--marinho);
    line-height:1.15;
    margin-bottom:2rem;
    letter-spacing:-.02em;
  }

  .cover-sub{
    font-size:1.15rem;
    font-weight:600;
    color:var(--marinho);
    max-width:560px;
    margin-bottom:3rem;
  }

  .cover-footer{
    display:flex;
    align-items:center;
    gap:1rem;
  }

  .cover-footer img{
    height:60px;
    width:auto;
  }

  .cover-footer span{
    font-weight:700;
    color:var(--marinho);
    font-size:1rem;
  }

  .scroll-hint{
    position:absolute;
    bottom:2.5rem;
    left:6%;
    z-index:1;
    font-size:.85rem;
    color:var(--texto-claro);
    display:flex;
    align-items:center;
    gap:.5rem;
  }

  .scroll-hint::after{
    content:"↓";
    animation:bounce 1.6s infinite;
  }

  @keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(6px);}
  }

  .layout{
    display:flex;
    align-items:flex-start;
  }

  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--marinho);
    color:var(--branco);
    height:100vh;
    position:sticky;
    top:0;
    overflow-y:auto;
    padding:2rem 1.5rem;
  }

  .sidebar-logo{
    display:flex;
    align-items:center;
    gap:.6rem;
    margin-bottom:2.5rem;
    padding-bottom:1.5rem;
    border-bottom:1px solid rgba(255,255,255,.12);
  }

  .sidebar-logo img{
    height:38px;
    width:auto;
  }

  .sidebar-logo span{
    font-size:.78rem;
    color:rgba(255,255,255,.6);
    text-transform:uppercase;
    letter-spacing:.08em;
  }

  .sidebar h3{
    font-size:.75rem;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--laranja);
    margin-bottom:1rem;
    font-weight:700;
  }

  .sidebar nav ul{list-style:none;}
  .sidebar nav li{margin-bottom:.3rem;}

  .sidebar nav a{
    display:flex;
    align-items:center;
    gap:.7rem;
    color:rgba(255,255,255,.75);
    text-decoration:none;
    font-size:.92rem;
    padding:.6rem .7rem;
    border-radius:6px;
    transition:all .15s ease;
  }

  .sidebar nav a:hover{
    background:rgba(255,255,255,.06);
    color:var(--branco);
  }

  .sidebar nav a .num{
    display:flex;
    align-items:center;
    justify-content:center;
    width:24px;
    height:24px;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    font-size:.75rem;
    font-weight:700;
    flex-shrink:0;
  }

  .sidebar nav a:hover .num{background:var(--azul-vibrante);}

  .content{
    flex:1;
    max-width:880px;
    padding:3.5rem 4rem 6rem;
  }

  .content h2{
    font-size:2rem;
    font-weight:800;
    color:var(--marinho);
    margin:3.5rem 0 1.2rem;
    padding-bottom:.7rem;
    border-bottom:3px solid var(--laranja);
    display:inline-block;
  }

  .content h2:first-of-type{margin-top:0;}

  .content h3{
    font-size:1.3rem;
    font-weight:700;
    color:var(--azul-vibrante);
    margin:2rem 0 .8rem;
  }

  .content p{
    margin-bottom:1rem;
    color:var(--texto);
  }

  .content ul, .content ol{
    margin:0 0 1.2rem 1.5rem;
  }

  .content li{margin-bottom:.4rem;}

  .box{
    border-radius:10px;
    padding:1.2rem 1.5rem;
    margin:1.5rem 0;
    display:flex;
    gap:.9rem;
    align-items:flex-start;
  }

  .box-icon{
    font-size:1.4rem;
    flex-shrink:0;
    line-height:1.4;
  }

  .box-dica{background:#EAF2FE;border-left:4px solid var(--azul-vibrante);}
  .box-atencao{background:#FFF6E8;border-left:4px solid var(--laranja);}
  .box-exemplo{background:#F0F9F0;border-left:4px solid #4CAF50;}

  .box strong{color:var(--marinho);}

  table{
    width:100%;
    border-collapse:collapse;
    margin:1rem 0 1.5rem;
    font-size:.92rem;
  }

  th{
    background:var(--marinho);
    color:var(--branco);
    text-align:left;
    padding:.7rem 1rem;
    font-weight:600;
  }

  th:first-child{border-radius:8px 0 0 0;}
  th:last-child{border-radius:0 8px 0 0;}

  td{
    padding:.65rem 1rem;
    border-bottom:1px solid var(--borda);
  }

  tr:nth-child(even) td{background:var(--cinza-claro);}

  code{
    background:var(--cinza-claro);
    border:1px solid var(--borda);
    padding:.15rem .45rem;
    border-radius:4px;
    font-family:'Consolas', monospace;
    font-size:.88em;
    color:var(--azul-vibrante);
  }

  .step{
    display:flex;
    gap:1.2rem;
    margin:1.8rem 0;
    align-items:flex-start;
  }

  .step-num{
    flex-shrink:0;
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--azul-vibrante);
    color:var(--branco);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:1.1rem;
  }

  .step-body{flex:1;}
  .step-body h3{margin:0 0 .5rem;}

  hr{
    border:none;
    border-top:1px solid var(--borda);
    margin:2.5rem 0;
  }

  .footer{
    background:var(--marinho);
    color:rgba(255,255,255,.7);
    padding:3rem 4rem;
    text-align:center;
  }

  .footer strong{color:var(--branco);}
  .footer a{color:var(--laranja);text-decoration:none;}

  .back-to-top{
    display:inline-block;
    margin-top:1.5rem;
    color:var(--azul-vibrante);
    background:rgba(255,255,255,.08);
    padding:.6rem 1.4rem;
    border-radius:6px;
    text-decoration:none;
    font-weight:600;
    font-size:.9rem;
    transition:background .15s ease;
  }

  .back-to-top:hover{background:rgba(255,255,255,.15);}

  @media (max-width: 900px){
    .layout{flex-direction:column;}
    .sidebar{
      width:100%;
      height:auto;
      position:relative;
      padding:1.5rem;
    }
    .content{padding:2rem 1.5rem 4rem;}
    .footer{padding:2.5rem 1.5rem;}
  }
</style>
</head>
